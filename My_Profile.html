<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Facebook Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#e9ebee;
}

.profile-card{
    width:320px;
    margin:40px auto;
    background:white;
    border:1px solid #ccc;
    border-radius:10px;
    text-align:center;
    overflow:hidden;
}

.cover{
    background:#1877f2;
    height:120px;
}

.profile-pic{
    width:100px;
    height:100px;
    border-radius:50%;
    border:4px solid white;
    margin-top:-50px;
    background:white;
}

h2{
    margin:10px 0;
}

p{
    padding:0 15px;
    font-size:15px;
    color:#333;
}
</style>

<body>

<div class="profile-card">

    <div class="cover"></div>

    <img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Student"
         alt="Profile Picture"
         class="profile-pic">

    <h2>Samantha C. Garcia</h2>

    <p><strong>Grade & Section:</strong> Grade 8 - Sapphire</p>

    <p><strong>Hobbies:</strong> I like decorating cakes</p>

    <p><strong>Favorite Quote:</strong><br>
    "Stop wasting time on men who never think about you"</p>

</div>

</body>
</html>
